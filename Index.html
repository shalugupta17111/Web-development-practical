
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Student Expense Tracker</h1>
        <p class="subtitle">Manage your daily expenses easily!</p>

        <div class="total-box">
            <h2>Total Expenses</h2>
            <h3 id="total">₹0.00</h3>
        </div>

        <form id="expenseForm">

            <div class="form-group">
                <label>Expense Name</label>
                <input type="text" id="expenseName"
                placeholder="Enter expense name">
            </div>

            <div class="form-group">
                <label>Amount (₹)</label>
                <input type="number" id="expenseAmount"
                placeholder="Enter amount" min="0.01" step="0.01">
            </div>

            <div class="form-group">
                <label>Category</label>
                <select id="category">
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <button type="submit" class="add-btn">
                + Add Expense
            </button>

        </form>

        <div class="filter-section">
            <label>Filter by Category</label>

            <select id="filterCategory">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <h2 class="expense-heading">Your Expenses</h2>

        <div id="expenseList">
            <p class="empty-message">No expenses added yet!</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
